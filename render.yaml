services:
  - type: web
    name: lightface-mobilefacenet-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: VERIFY_THRESHOLD
        value: "0.40"
